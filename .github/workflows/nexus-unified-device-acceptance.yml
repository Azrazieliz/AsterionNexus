name: Nexus unified Android real acquisition acceptance

on:
  push:
    branches: [work/nexus-harmonization-20261126]
    paths:
      - app/src/androidTest/java/com/azrael/pixivdumpsync/DeviceTransferSimulation.kt
      - .github/workflows/nexus-unified-device-acceptance.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nexus-unified-android-device-acceptance
  cancel-in-progress: true

jobs:
  emulator-acquisition-library:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Confirm hardware-accelerated emulator capability
        shell: bash
        run: |
          set -euo pipefail
          test -c /dev/kvm
          sudo chgrp "$(id -gn)" /dev/kvm
          sudo chmod g+rw /dev/kvm
          test -r /dev/kvm
          test -w /dev/kvm
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "emulator"
          test -x "$ANDROID_HOME/emulator/emulator"
          "$ANDROID_HOME/emulator/emulator" -accel-check
      - name: Install accepted Android compilation API
        shell: bash
        run: |
          set -euo pipefail
          sdk="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          test -x "$sdk"
          yes | "$sdk" --licenses >/dev/null || true
          "$sdk" "platforms;android-36"
      - name: Verify and restore exact immutable Downloader extractor wheel
        run: bash scripts/restore_downloader_wheel.sh
      - name: Run existing provider source and instrumentation build gate
        run: |
          gradle --no-daemon --max-workers=2 \
            :app:verifyFrozenVideoProviders :app:testPhonepilotUnitTest \
            :app:assemblePhonepilot :app:assemblePhonepilotAndroidTest \
            --stacktrace --console=plain
      - name: Execute actual Android original-to-Nexus-library transaction
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          emulator-boot-timeout: 1200
          emulator-options: -no-window -no-snapshot -noaudio -no-boot-anim -gpu swiftshader_indirect -memory 3072 -cores 2 -accel on
          script: |
            set -eu
            adb wait-for-device
            until [ "$(adb shell getprop sys.boot_completed | tr -d '\r')" = 1 ]; do sleep 2; done
            sleep 12
            adb install -r app/build/outputs/apk/phonepilot/app-phonepilot.apk
            adb install -r app/build/outputs/apk/androidTest/phonepilot/app-phonepilot-androidTest.apk
            adb logcat -c
            set +e
            timeout --signal=TERM --kill-after=10s 320s adb shell am instrument -w -r com.asterion.nexus.testphone1111.test/com.azrael.pixivdumpsync.DeviceTransferSimulation > nexus-android-instrumentation.txt 2>&1; printf '%s\n' "$?" > nexus-android-exit.txt
            adb logcat -b crash -d -v threadtime > nexus-android-crashes.txt
            adb logcat -d -v threadtime > nexus-android-logcat.txt
            set -e
            grep -Fx '0' nexus-android-exit.txt
            if grep -Fq 'Process crashed' nexus-android-instrumentation.txt; then cat nexus-android-crashes.txt; exit 1; fi
            grep -F 'AST_SIM: NATIVE_OK' nexus-android-instrumentation.txt
            grep -F 'AST_SIM: NATIVE_206_OK' nexus-android-instrumentation.txt
            grep -F 'AST_SIM: NEXUS_ACQ_LIB_OK' nexus-android-instrumentation.txt
            grep -F 'AST_SIM: PARALLEL_NATIVE_OK' nexus-android-instrumentation.txt
            grep -F 'AST_SIM: PYTHON_RUNTIME_OK' nexus-android-instrumentation.txt
            grep -F 'AST_SIM: EMBEDDED_OK' nexus-android-instrumentation.txt
            grep -F 'AST_SIM: PASS' nexus-android-instrumentation.txt
            if grep -Fq 'FATAL EXCEPTION' nexus-android-crashes.txt; then cat nexus-android-crashes.txt; exit 1; fi
      - name: Preserve emulator execution and failure evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Nexus-unified-real-Android-original-to-library-receipts
          if-no-files-found: warn
          retention-days: 7
          path: |
            nexus-android-instrumentation.txt
            nexus-android-exit.txt
            nexus-android-crashes.txt
            nexus-android-logcat.txt
