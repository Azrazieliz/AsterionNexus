name: Nexus specification validation

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-specification:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install pinned specification validator
        run: python -m pip install --disable-pip-version-check "jsonschema==4.23.0"
      - name: Validate canonical decisions, schemas, fixtures and non-claims
        run: python scripts/verify_spec.py
