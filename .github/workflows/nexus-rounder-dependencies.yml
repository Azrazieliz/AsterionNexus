name: Nexus pinned Rounder reader dependencies
on:
  push:
    branches: [work/merge-core-downloader-rounder]
    paths:
      - scripts/resolve_rounder_reader_dependencies.py
      - .github/workflows/nexus-rounder-dependencies.yml
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: nexus-rounder-dependencies
  cancel-in-progress: false
jobs:
  restore:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --disable-pip-version-check 'PyYAML==6.0.2'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Restore exact upstream native document source and dependency versions
        run: python scripts/resolve_rounder_reader_dependencies.py
      - name: Check runtime dependency completeness
        run: |
          set -euo pipefail
          test -s rounder/src/main/java/com/openlocal/office/core/XmlUtil.java
          test -s rounder/src/main/java/com/openlocal/office/core/ZipPackage.java
          grep -Fq 'poi-scratchpad:' rounder/build.gradle.kts
          grep -Fq 'poi:' rounder/build.gradle.kts
      - name: Commit recovered engines to work branch without overwriting other work
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add rounder/src/main/java/com/openlocal/office/core/XmlUtil.java rounder/src/main/java/com/openlocal/office/core/ZipPackage.java rounder/build.gradle.kts
          git diff --cached --quiet && exit 0
          git commit -m 'fix(nexus): restore exact pinned Rounder DOCX XML/ZIP and POI dependencies'
          git fetch origin "$GITHUB_REF_NAME"
          git rebase "origin/$GITHUB_REF_NAME"
          git push origin "HEAD:$GITHUB_REF_NAME"
