name: Nexus Android native compile and regression
on:
  push:
    branches: [work/merge-core-downloader-rounder]
    paths:
      - 'app/**'
      - 'fusion/**'
      - 'rounder/**'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
      - 'gradle.properties'
      - 'scripts/restore_downloader_wheel.sh'
      - '.github/workflows/nexus-android.yml'
  pull_request:
    paths:
      - 'app/**'
      - 'fusion/**'
      - 'rounder/**'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
      - 'gradle.properties'
      - 'scripts/restore_downloader_wheel.sh'
permissions:
  contents: read
jobs:
  compile:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Verify native source identities
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq 'applicationId = "com.asterion.nexus"' app/build.gradle.kts
          grep -Fq 'namespace = "com.ailm.android"' fusion/build.gradle.kts
          grep -Fq 'namespace = "com.openlocal.office"' rounder/build.gradle.kts
          test -s fusion/src/main/java/com/ailm/android/runtime/FusionDatabaseRepository.kt
          test -s rounder/src/main/java/com/openlocal/office/core/FgTeraboxClient.java
          test -s app/src/main/java/com/asterion/videoflow/NativeMediaDownloader.kt
      - name: Restore original SHA-pinned Downloader yt-dlp wheel
        run: bash scripts/restore_downloader_wheel.sh
      - name: Compile native three-way Android source
        run: gradle --no-daemon --max-workers=2 :fusion:compileDebugKotlin :rounder:compileDebugJavaWithJavac :app:compileDebugKotlin --stacktrace
      - name: Run inherited Downloader regression suite
        if: success()
        run: gradle --no-daemon --max-workers=2 :app:testDebugUnitTest --stacktrace
      - name: Assemble isolated debug APK
        if: success()
        run: gradle --no-daemon --max-workers=2 :app:assembleDebug --stacktrace
      - name: Confirm co-installable package identity
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          aapt="$ANDROID_HOME/build-tools/35.0.0/aapt"
          test -x "$aapt"
          "$aapt" dump badging app/build/outputs/apk/debug/app-debug.apk | grep -F "package: name='com.asterion.nexus'"
      - name: Archive debug artifact for CI inspection only
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Nexus-debug-CI-only-not-owner-approved
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7
