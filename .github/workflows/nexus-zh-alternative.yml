name: Nexus alternative Chinese translation candidate
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pinned CPU conversion tools
        run: |
          python -m pip install 'torch==2.6.0' --index-url https://download.pytorch.org/whl/cpu
          python -m pip install 'transformers==4.51.3' 'huggingface_hub==0.30.2' 'numpy==1.26.4' 'onnxruntime==1.22.1' 'onnx==1.18.0' 'sentencepiece==0.2.0'
      - name: Verify weights and perform real export and unchanged language smoke
        run: python scripts/prepare_nexus_zh_alternative.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nexus-alternative-zh-reference-not-device-certified
          path: |
            nexus_zh_alternative_smoke.json
            app/src/main/assets/translation-models/zh
          if-no-files-found: warn
          retention-days: 7
